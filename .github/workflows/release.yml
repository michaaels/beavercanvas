name: Release plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.6.7-beta.1
        required: true
        type: string
      dry_run:
        description: Build and validate without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, source version and publication policy
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py plan
      - name: Validate release automation contracts
        run: python scripts/test-release.py
  package:
    needs: plan
    uses: ./.github/workflows/p2-package.yml
    with:
      source_commit: ${{ needs.plan.outputs.commit }}
  verify:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package.outputs.installer_artifact }}
          path: .dev/release-package
      - name: Verify the tested archive and prepare release notes
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: python scripts/release.py verify .dev/release-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beavercanvas-release-${{ needs.plan.outputs.tag }}
          path: .dev/release-package/publish/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: needs.plan.outputs.dry_run == 'false'
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beavercanvas-release-${{ needs.plan.outputs.tag }}
          path: .dev/release-publish
      - name: Publish verified ZIP, checksum and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: python scripts/release.py publish .dev/release-publish
