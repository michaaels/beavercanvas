name: Project website

on:
  pull_request:
    paths: ['website/**', 'docs/screenshots/**', 'plugins/org.example.dbeaver.echarts/web/assets/**', 'scripts/build-pages.js', 'scripts/test-pages.js', 'scripts/browser-test-runtime.js', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['website/**', 'docs/screenshots/**', 'plugins/org.example.dbeaver.echarts/web/assets/**', 'scripts/build-pages.js', 'scripts/test-pages.js', 'scripts/browser-test-runtime.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build static site from canonical assets
        run: node scripts/build-pages.js
      - name: Prepare browser validation
        run: |
          mkdir -p .dev/browser-tests
          cp dev/ci/browser/package*.json .dev/browser-tests/
          npm ci --prefix .dev/browser-tests --ignore-scripts --no-audit --no-fund
          node .dev/browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check mobile layout, keyboard navigation and assets
        run: node scripts/test-pages.js
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .dev/pages-site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
